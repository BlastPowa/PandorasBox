<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pandora's Box — Library</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="panel-head">
    <div><span class="brand-mark">Pandora’s Box</span><span class="head-sub">Browser companion · <span id="extensionVersion"></span></span></div><button id="openWeb" class="web-link" aria-label="Open Pandora’s Box">↗</button>
  </header>

  <section class="library-intro"><p class="eyebrow">YOUR SPACE</p><h1>Your library</h1><p>Everything you’re watching and reading.</p><div class="library-summary" id="librarySummary" aria-live="polite"></div></section>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="filterInput" aria-label="Filter your library" type="search" placeholder="Filter your library..." autocomplete="off" />
  </div>

  <div class="filter-row" id="typeFilters" role="group" aria-label="Media type">
    <button class="pill active" data-type="all">All</button>
    <button class="pill" data-type="movie">Movies</button>
    <button class="pill" data-type="series">Shows</button>
    <button class="pill" data-type="anime">Anime</button>
    <button class="pill" data-type="manga">Manga</button>
    <button class="pill" data-type="manhwa">Manhwa</button>
    <button class="pill" data-type="comic">Comics</button>
  </div>

  <label class="status-control">Status<select id="statusFilter"><option value="all">All statuses</option><option value="watching">Watching</option><option value="rewatching">Rewatching</option><option value="reading">Reading</option><option value="completed">Completed</option><option value="planned">Planned</option><option value="on_hold">On hold</option><option value="dropped">Dropped</option></select></label>
  <div class="results-label" id="resultsLabel" aria-live="polite"></div>
  <main class="library" id="library"></main>

  <div class="detail-overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-label="Title details" hidden>
    <div class="detail-inner" id="detailInner"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
